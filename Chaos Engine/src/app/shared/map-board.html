<div class="stage" [style.transform]="stageTransform()">
<img class="atlas" [src]="map().asset" [alt]="map().name" draggable="false" />
<svg
  class="overlay"
  [class.placing]="placing()"
  [attr.viewBox]="viewBox()"
  preserveAspectRatio="none"
  (click)="onBoardClick($event)"
>
  <!-- Mother Dark: auras first, so markers sit above them. -->
  @for (t of visibleTemples(); track t.id) {
    @if (t.active) {
      <circle class="aura" [attr.cx]="x(t.position)" [attr.cy]="y(t.position)" [attr.r]="auraR()" />
    }
  }

  @for (t of visibleTemples(); track t.id) {
    <g
      class="temple"
      [class.active]="t.active"
      [class.hidden]="t.hidden"
      [class.selected]="t.id === selectedId()"
      [class.drop]="t.id === dropTarget()"
      (dragover)="onDragOver($event, t.id)"
      (dragleave)="onDragLeave(t.id)"
      (drop)="onDrop($event, t.id)"
      [attr.transform]="markerAt(t.position)"
      tabindex="0"
      role="button"
      [attr.aria-label]="t.name"
      (click)="onMarker($event, t.id)"
      (keydown.enter)="onMarker($event, t.id)"
    >
      <title>{{ t.name }}{{ t.active ? '' : ' (dormant)' }}</title>
      <circle class="ring" [attr.r]="r + 4" />
      <!-- A temple of Mother Dark on a plate of night, so it reads on any land. -->
      <circle class="plate" [attr.r]="r + 1" />
      <path class="glyph" [attr.d]="templePath" />
      @if (t.assigned.length) {
        <g class="badge" [attr.transform]="'translate(' + r + ' ' + r + ')'">
          <circle r="5.5" />
          <text dy="0.3em">{{ t.assigned.length }}</text>
        </g>
      }
    </g>
  }

  @for (p of visiblePortals(); track p.id) {
    <g
      class="portal"
      [style.--heat]="heat(p.corruption)"
      [class.legendary]="p.legendary"
      [class.hidden]="p.hidden"
      [class.selected]="p.id === selectedId()"
      [class.drop]="p.id === dropTarget()"
      (dragover)="onDragOver($event, p.id)"
      (dragleave)="onDragLeave(p.id)"
      (drop)="onDrop($event, p.id)"
      [attr.transform]="markerAt(p.position)"
      tabindex="0"
      role="button"
      [attr.aria-label]="title(p)"
      (click)="onMarker($event, p.id)"
      (keydown.enter)="onMarker($event, p.id)"
    >
      <title>{{ title(p) }}</title>
      @if (p.legendary) {
        <circle class="legend" [attr.r]="r + 9" />
      }
      <circle class="ring" [attr.r]="r + 7" />
      @for (d of notches; track $index) {
        <path class="notch" [class.lit]="$index < p.corruption" [attr.d]="d" />
      }
      <circle class="rift" [attr.r]="r" />
      <!-- Lining digits carry ink from 0 to 0.60em above the baseline: 0.30em centres it. -->
      <text class="difficulty" dy="0.3em">{{ p.difficulty }}</text>
      <!-- Cards sent here: a brass badge, so it never reads as a second difficulty. -->
      @if (p.assigned.length) {
        <g class="badge" [attr.transform]="'translate(' + r + ' ' + r + ')'">
          <circle r="5.5" />
          <text dy="0.3em">{{ p.assigned.length }}</text>
        </g>
      }
    </g>
  }
</svg>
</div>

@if (zoomable() || iconSizeKey()) {
  <div class="tools">
    @if (iconSizeKey()) {
      <div class="group icons" role="group" aria-label="Icon size">
        <span class="label">Icons</span>
        <button type="button" aria-label="Smaller icons" [disabled]="iconSize() <= iconSizeRange[0]" (click)="smallerIcons()">−</button>
        <button type="button" class="pct num" title="Back to the usual size" (click)="setIconSize(1)">{{ iconPct() }}%</button>
        <button type="button" aria-label="Larger icons" [disabled]="iconSize() >= iconSizeRange[1]" (click)="largerIcons()">+</button>
      </div>
    }
    @if (zoomable()) {
      <div class="group zoom" role="group" aria-label="Zoom the map">
        <button type="button" aria-label="Zoom in" [disabled]="zoom() >= maxZoom" (click)="zoomIn()">+</button>
        <button type="button" aria-label="Zoom out" [disabled]="zoom() <= 1" (click)="zoomOut()">−</button>
        @if (zoom() > 1) {
          <button type="button" class="whole" (click)="resetZoom()">Whole map</button>
        }
      </div>
    }
  </div>
}
